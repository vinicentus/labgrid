name: types-labgrid stubs

on:
  push:
    paths:
      - "labgrid-stubs/**"
      - ".github/workflows/types-labgrid-stubs.yml"
  pull_request:
    paths:
      - "labgrid-stubs/**"
      - ".github/workflows/types-labgrid-stubs.yml"

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: labgrid-stubs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff format --check src
          ruff check src
      - name: Mypy
        run: mypy src/labgrid
