[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "types-labgrid"
version = "0.1.0"
description = "PEP 561 typing stubs for labgrid (https://github.com/labgrid-project/labgrid)"
readme = "README.rst"
license = { text = "LGPL-2.1-or-later" }
requires-python = ">=3.10"
authors = [{ name = "labgrid typing stubs maintainers" }]
keywords = ["labgrid", "stubs", "typing", "types"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Stubs Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/labgrid-project/labgrid"
Repository = "https://github.com/labgrid-project/labgrid"
Issues = "https://github.com/labgrid-project/labgrid/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.5.7",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labgrid = ["**/*.pyi", "py.typed"]

[tool.ruff]
line-length = 119
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
# Draft stubs from stubgen are intentionally incomplete; keep checks that catch
# structural issues without requiring full annotations on every parameter.
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_incomplete_stub = true
ignore_missing_imports = true
